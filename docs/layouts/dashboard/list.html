{{ define "main" }}
<main id="main" class="example-page">
  <div class="example-app">
    {{ partial "dashboard-sidebar.html" . }}
    <div class="example-app__content">
      <section class="example-stage" aria-labelledby="dashboard-title">
        <header class="example-hero example-hero--compact">
          <div>
            <span class="overline">Static presentation mockup</span>
            <h1 id="dashboard-title">{{ .Title }}</h1>
            {{ with .Description }}<p>{{ . }}</p>{{ end }}
          </div>
          <span class="example-status example-status--warn">Example data</span>
        </header>
        <article class="prose">
          {{ .Content }}
        </article>
        {{ partial "child-cards.html" . }}
      </section>
    </div>
  </div>
</main>
{{ end }}
