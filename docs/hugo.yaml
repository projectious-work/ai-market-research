baseURL: "https://projectious-work.github.io/ai-market-research/"
title: Signal Room
description: "Inspectable decision support for AI infrastructure-oriented developers choosing models, configurations, subscriptions, agent harnesses, and self-hosting options."
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true

# Hugo's default execution policy does not yet include the Tailwind v4 binary
# invoked by css.TailwindCSS. Keep the default allowlist and add only the
# exact theme build executable.
security:
  exec:
    allow:
      - "^(dart-)?sass$"
      - "^go$"
      - "^git$"
      - "^node$"
      - "^postcss$"
      - "^tailwindcss$"

markup:
  goldmark:
    renderer:
      unsafe: false
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [["\\[", "\\]"], ["$$", "$$"]]
          inline: [["\\(", "\\)"]]
    parser:
      attribute:
        # Without block attributes, markdown such as `{.lead .display-6}`
        # renders as visible literal text instead of applying the classes.
        block: true
        title: true
  highlight:
    noClasses: false
    lineNos: false
    guessSyntax: true
    tabWidth: 2
  tableOfContents:
    startLevel: 2
    endLevel: 4

outputs:
  home: [HTML, RSS, SearchIndex, LLMS]
  page: [HTML, Markdown]
  section: [HTML, RSS, Print, Markdown]

outputFormats:
  SearchIndex:
    mediaType: application/json
    baseName: index
    isPlainText: true
    notAlternative: true
  Print:
    mediaType: text/html
    baseName: print
    isHTML: true
    notAlternative: true
    permalinkable: true
  LLMS:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true
  Markdown:
    mediaType: text/markdown
    isPlainText: true
    permalinkable: true

params:
  description: "Inspectable decision support for AI infrastructure-oriented developers choosing models, subscriptions, agent harnesses, and self-hosting options."
  productionURL: "https://projectious-work.github.io/ai-market-research/"
  version: "main"
  github: "https://github.com/projectious-work/ai-market-research"
  editURL:
    default: "https://github.com/projectious-work/ai-market-research/edit/main/docs/content/"
  darkSurface: "navy"
  codeTheme: "adaptive"
  sidebarOpenDepth: 0
  sidebarSections: ["dashboard", "docs"]
  build:
    tailwind: true
  # deploy-docs.sh overrides these simple parameter names for immutable
  # versioned snapshots. Avoid underscores here: Hugo treats them as nesting
  # separators when parameters are supplied through environment variables.
  archive: false
  latest: "https://projectious-work.github.io/ai-market-research/"
  versions:
    - label: "main"
      url: "/"
      note: "latest"
    - label: "v0.4.2"
      url: "v0.4.2/"
    - label: "v0.4.1"
      url: "v0.4.1/"
    - label: "v0.4.0"
      url: "v0.4.0/"
  copyright:
    authors: "projectious"
    from_year: 2026

menus:
  main:
    - name: Dashboard
      weight: 10
      pageRef: "/dashboard"
    - name: Documentation
      weight: 20
      pageRef: "/docs"
    - name: Change Log
      weight: 30
      pageRef: "/changelog"

module:
  imports:
    - path: github.com/projectious-work/brand-theme-hugo-vanilla
  mounts:
    - source: assets
      target: assets
    - source: static
      target: static
    - source: node_modules/@tabler/icons/icons/outline
      target: assets/tabler-icons/outline

build:
  buildStats:
    enable: true

taxonomies:
  tag: tags
  category: categories
